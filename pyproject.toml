[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gfi"
version = "0.1.0"
description = "GFI (Generate Frame Inbetween): 10-bit/HDR frame interpolation with RIFE, ONNX Runtime and FFmpeg"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "onnxruntime-directml>=1.24; sys_platform == 'win32'",
    "onnxruntime>=1.24; sys_platform != 'win32'",
    "numpy>=2.0",
]

[project.scripts]
gfi-cli = "gfi.cli:main"
inbetween-cli = "inbetween.cli:main"

[project.gui-scripts]
gfi = "gfi.gui:main"
inbetween = "inbetween.gui:main"

[project.optional-dependencies]
gui = ["pyside6>=6.7"]
build = ["pyinstaller>=6.10"]

[tool.setuptools]
packages = ["inbetween", "gfi"]
